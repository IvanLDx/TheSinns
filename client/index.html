<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="icon" type="image/x-icon" href="client/favicon.ico" />
		<title>Document</title>
		<link rel="stylesheet" href="./client/css/master.css" />
		<link rel="stylesheet" href="./client/css/userMenu.css" />
	</head>

	<body data-stage="login">
		<!-- LOGIN -->
		<section class="login">
			<h1>The House of the Pixel Sun</h1>

			<div class="expiration-msg">Rematou a sesión <button class="refresh">Ingresa outra vez!</button></div>

			<form class="login-form">
				<label for="username">Nome</label>
				<input id="username" name="username" type="text" autocomplete="username" />
				<label for="password">Contrasinal</label>
				<input id="password" name="password" type="password" autocomplete="current-password" />

				<input name="honeypot" type="hidden" />
				<input class="csrf-token" type="hidden" name="csrf_token" />

				<input class="submit" type="submit" value="Dálle!" />
				<span class="error-msg"></span>

				<div class="loader hidden">
					<div class="backdrop"></div>
					<div class="spinner"></div>
				</div>
			</form>
		</section>

		<!-- USER MENU -->
		<section class="user-menu">
			<h1 class="name"></h1>

			<div class="worlds-container">
				<div class="prototype__world-sheet">
					<div class="world-image"></div>
					<p class="world-name">Name yeah</p>
				</div>

				<div class="world-sheet">
					<div class="world-image"></div>
					<p class="world-name">Name yeah</p>
				</div>

				<div class="world-sheet">
					<div class="world-image"></div>
					<p class="world-name">Name yeah</p>
				</div>

				<div class="world-sheet">
					<div class="world-image"></div>
					<p class="world-name">Name yeah</p>
				</div>
			</div>

			<div class="buttons"></div>
		</section>

		<!-- WORLD -->
		<canvas class="canvas"></canvas>

		<!-- SCRIPTS -->
		<script src="https://cdn.socket.io/4.5.4/socket.io.js"></script>
		<script src="./client/js/menu.js" type="module"></script>
		<script src="./client/js/login.js" type="module"></script>
		<script src="./client/js/main.js" type="module"></script>
	</body>
</html>
