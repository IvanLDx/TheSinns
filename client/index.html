<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="icon" type="image/x-icon" href="client/favicon.ico" />
		<title>Document</title>
		<link rel="stylesheet" href="./client/css/master.css" />
		<link rel="stylesheet" href="./client/css/login.css" />
		<link rel="stylesheet" href="./client/css/userMenu.css" />
	</head>

	<body data-stage="login">
		<!-- LOGIN -->
		<section class="login">
			<h1 class="login__title">The House of the Pixel Sun</h1>
			<section class="login__wrapper">
				<div class="login-msg disconnected-msg">Disconnected from server.</div>
				<div class="login-msg expiration-msg">Rematou a sesión <button class="refresh">Ingresa outra vez!</button></div>

				<form class="login-form">
					<label class="form-input" for="username">
						<span>Nome</span>
						<input id="username" name="username" type="text" autocomplete="username" />
					</label>
					<label class="form-input" for="password">
						<span> Contrasinal </span>
						<input id="password" name="password" type="password" autocomplete="current-password" />
					</label>

					<input name="honeypot" type="text" />
					<input class="csrf-token" type="hidden" name="csrf_token" />

					<input class="submit" type="submit" value="Dálle!" />
					<span class="error-msg"></span>

					<div class="loader hidden">
						<div class="backdrop"></div>
						<div class="spinner"></div>
					</div>
				</form>
			</section>
		</section>

		<!-- USER MENU -->
		<section class="user-menu">
			<h1 class="name"></h1>

			<div class="worlds-container">
				<div class="prototype__world-sheet">
					<div class="world-image"></div>
					<p class="world-name"></p>
				</div>

				<div class="world-sheet world-sheet--new" data-type="new">
					<div class="world-sheet--new__container">
						<div class="world-image"></div>

						<p class="world-name">Crea un novo terreo</p>

						<form class="new-world-form">
							<label for="world-name">
								<span>Nome:</span>
								<input id="world-name" type="text" name="world-name" autocomplete="off" />
							</label>

							<div class="range__wrapper">
								<div class="range__wrapper-items">
									<span class="range__wrapper-items-title">Tamaño:</span>
									<input type="range" min="6" max="60" name="world-width" value="10" />
									<input type="range" min="6" max="60" name="world-height" value="18" />
								</div>

								<div class="range__wrapper-value-container">
									<div class="range__wrapper-value">
										<span class="world-width-value"></span>
										x
										<span class="world-height-value"></span>
									</div>
								</div>
							</div>
							<input type="text" name="honeypot" />
							<input class="csrf-token" type="hidden" name="csrf_token" />

							<div class="world-cta__container">
								<button class="world-cta world-create" type="submit">Dálle!</button>
								<button class="world-cta world-cancel" type="button">Cancelar</button>
							</div>

							<p class="error-msg"></p>
						</form>
					</div>
				</div>
			</div>

			<div class="buttons"></div>
		</section>

		<!-- WORLD -->
		<canvas class="canvas"></canvas>

		<!-- SCRIPTS -->
		<script src="https://cdn.socket.io/4.5.4/socket.io.js"></script>
		<script src="./client/js/stages/menu.js" type="module"></script>
		<script src="./client/js/stages/login.js" type="module"></script>
		<script src="./client/js/main.js" type="module"></script>
	</body>
</html>
